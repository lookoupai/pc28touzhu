<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc28touzhu 后台控制台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+SC:wght@400;500;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
    __APP_SHELL__
    <div class="shell app-page" id="mainContent" tabindex="-1">

        <div class="admin-layout">


            <div class="admin-main">
                <header class="page-hero">
                    <div class="page-copy">
                        <p id="adminPageEyebrow" class="eyebrow">后台控制台</p>
                        <h1 id="adminPageTitle">值班总览</h1>
                        <p id="adminPageDescription" class="hero-text">用于值班、排障和平台运营，不再作为对象级调试台使用。</p>
                        <div class="hero-actions">
                            <button id="adminRefreshBtn" class="primary-btn" type="button">刷新当前页</button>
                            <a class="ghost-btn link-btn" href="/">返返回工作台</a>
                        </div>
                    </div>
                    <aside class="session-panel">
                        <p class="field-label">当前会话</p>
                        <div class="current-user-card">
                            <strong id="adminSessionUsername">加载中</strong>
                            <span id="adminSessionMeta">正在读取当前登录会话</span>
                        </div>
                        <dl class="session-meta">
                            <div>
                                <dt>当前页面</dt>
                                <dd id="adminCurrentSection">值班总览</dd>
                            </div>
                            <div>
                                <dt>最近刷新</dt>
                                <dd id="adminLastRefreshAt">--</dd>
                            </div>
                        </dl>
                        <div class="form-actions wide">
                            <button class="ghost-btn" type="button" data-account-open>账户操作</button>
                        </div>
                        <p class="panel-hint">高风险操作将从普通浏览区分离，首页默认仅提供汇总、排障与跳转入口。</p>
                    </aside>
                </header>

                <div id="statusMessage" class="status-banner" aria-live="polite"></div>

                <main id="adminContent" class="admin-content" tabindex="-1">
                    <section class="panel loading-panel">
                        <div class="panel-header">
                            <div>
                                <p class="panel-kicker">后台加载中</p>
                                <h2>正在准备后台页面</h2>
                            </div>
                        </div>
                        <div class="skeleton-grid">
                            <div class="skeleton-card"></div>
                            <div class="skeleton-card"></div>
                            <div class="skeleton-card"></div>
                            <div class="skeleton-card"></div>
                        </div>
                    </section>
                </main>
            </div>
        </div>
    </div>

    __ACCOUNT_DIALOG__

    <script src="/assets/ui-text.js"></script>
    <script src="/assets/auth-panel.js"></script>
    <script src="/assets/account-menu.js"></script>
    <script src="/assets/auth-guard.js"></script>
    <script src="/assets/dashboard.js"></script>
</body>
</html>
